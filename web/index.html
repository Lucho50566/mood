<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="description" content="Turnos, rutina y abonos de MOOD Training Club.">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOOD">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<title>MOOD · Training Club</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <span class="glow g1"></span>
  <span class="glow g2"></span>
</div>

<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-in">
    <img src="img/logo.jpg" alt="" class="splash-logo">
    <div class="splash-word">MOOD</div>
    <div class="splash-sub">Training Club</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>
<script>
  window.__moodT0 = Date.now();
  try {
    if (sessionStorage.getItem('mood.splash')) document.getElementById('splash').remove();
    else sessionStorage.setItem('mood.splash', '1');
  } catch (_) {}
</script>

<main id="app" class="app"></main>

<nav id="nav" class="nav" aria-label="Navegación"></nav>

<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
