services:
  - type: web
    name: mood-training-club
    runtime: node
    # Plan gratis: no tiene disco persistente. La base SQLite se reinicia en cada deploy
    # o reinicio del servidor. Para uso real: plan "starter" + disco montado en /var/data
    # y la variable MOOD_DATA=/var/data (ver LEEME-DEPLOY.md, opción D).
    plan: free
    region: oregon
    buildCommand: "echo sin dependencias"
    startCommand: "node server.js"
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
