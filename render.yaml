services:
  - type: web
    name: mood-training-club
    runtime: node
    # El disco persistente (para SQLite) solo existe en planes pagos. "starter" es el más chico.
    plan: starter
    region: oregon
    buildCommand: "echo sin dependencias"
    startCommand: "node server.js"
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # La base SQLite y las imágenes subidas viven en el disco, no en el filesystem efímero.
      - key: MOOD_DATA
        value: /var/data
    disk:
      name: mood-data
      mountPath: /var/data
      sizeGB: 1
